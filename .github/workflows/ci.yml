name: CI

# Runs on pull requests to main and by hand (Actions > CI > Run workflow). It does
# NOT run on every push: Actions minutes cost money. Pushes to main are covered by
# the deploy workflows, which build what they ship.
#
# Three cheap jobs, ubuntu only, pnpm cache:
#   backend    typecheck, unit tests, Medusa lint, `medusa build`
#   storefront typecheck, unit tests, Next build, OpenNext (Workers) build
#   infra      bash -n, the shell tests for deploy/bootstrap/backup, shellcheck,
#              compose and workflow files parse
#
# Every third-party action is pinned to a full commit SHA; the tag is in the
# comment after it.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @dtc/backend exec tsc --noEmit

      - name: Unit tests
        run: pnpm --filter @dtc/backend test:unit

      # Medusa's lint rules encode framework requirements (AGENTS.md).
      - name: Lint
        run: pnpm --filter @dtc/backend exec medusa lint

      # `medusa build` skips the production checks and needs no secrets.
      - name: Build
        run: pnpm --filter @dtc/backend build

  storefront:
    name: Storefront
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # next build needs a publishable key to exist; the value is never used.
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_not_a_real_key
      # A closed port: the build must not need the backend.
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://127.0.0.1:59999
      NEXT_PUBLIC_IMAGE_HOST: img.azira.com.au
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # next.config sets typescript.ignoreBuildErrors, so type errors are only
      # caught here.
      - name: Typecheck
        run: pnpm --filter @dtc/storefront exec tsc --noEmit

      - name: Unit tests
        run: pnpm --filter @dtc/storefront test

      # The Cloudflare Workers bundle (it includes `next build`). It cannot be
      # built on Windows, so this is where it is proven.
      - name: Build for Cloudflare Workers
        working-directory: apps/storefront
        run: pnpm exec opennextjs-cloudflare build

  infra:
    name: Infra scripts and files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: bash -n on every script
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            bash -n "$f"
          done < <(git ls-files 'infra/**/*.sh' 'infra/deploy/tests/stubs/*' 'infra/backup/tests/stubs/*')

      - name: Shell tests (no Docker needed)
        run: |
          set -euo pipefail
          bash infra/deploy/tests/run.sh
          bash infra/vps/tests/test-bootstrap.sh
          bash infra/backup/tests/run.sh

      # shellcheck is preinstalled on ubuntu-latest.
      - name: shellcheck
        run: shellcheck -S warning infra/vps/bootstrap.sh infra/vps/make-user-data.sh infra/deploy/deploy.sh infra/deploy/deploy-gate.sh infra/deploy/apply-env.sh infra/backup/backup.sh infra/backup/restore.sh

      - name: The production compose file parses
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/certs"
          touch "$tmp/.env" "$tmp/redis.env" "$tmp/tunnel.env" "$tmp/certs/supabase-ca.crt"
          sed "s#/opt/azira#$tmp#g" infra/compose/docker-compose.prod.yml > "$tmp/c.yml"
          BACKEND_IMAGE=ghcr.io/example/azira-backend IMAGE_TAG=ci \
            docker compose -f "$tmp/c.yml" --project-directory "$tmp" --profile migrate config --quiet

      - name: Workflow files parse
        run: |
          set -euo pipefail
          python3 -c "
          import glob, yaml
          for f in sorted(glob.glob('.github/workflows/*.y*ml')):
              yaml.safe_load(open(f))
              print('ok', f)
          "
