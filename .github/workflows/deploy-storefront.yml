name: Deploy storefront

# Builds the storefront with OpenNext and deploys it to Cloudflare Workers
# (azira.com.au and www.azira.com.au, routes in apps/storefront/wrangler.jsonc).
#
# Triggers
# - Push to main that changes apps/storefront/** or pnpm-lock.yaml.
# - Manual (Actions > Deploy storefront > Run workflow), always.
# NEXT_PUBLIC_* values are baked into the build, so a deploy is always a rebuild.
#
# Secrets (repository secrets): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY, NEXT_PUBLIC_STRIPE_KEY.
# Variables (optional; the defaults are the real Azira values): API_URL
# (https://api.azira.com.au), BASE_URL (https://azira.com.au), IMAGE_HOST
# (img.azira.com.au), STORE_NAME (Azira), DEFAULT_REGION (au).
#
# The run refuses while apps/storefront/wrangler.jsonc still has the D1 database_id
# placeholder: create the tag-cache database first (`wrangler d1 create
# azira-tag-cache`), then commit the id it prints.
#
# Every action is pinned to a full commit SHA; the tag is in the comment after it.
on:
  push:
    branches: [main]
    paths:
      - "apps/storefront/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-storefront.yml"
  workflow_dispatch:

concurrency:
  group: deploy-storefront
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKEND_URL: ${{ vars.API_URL || 'https://api.azira.com.au' }}
      BASE_URL: ${{ vars.BASE_URL || 'https://azira.com.au' }}
      IMAGE_HOST: ${{ vars.IMAGE_HOST || 'img.azira.com.au' }}
      STORE_NAME: ${{ vars.STORE_NAME || 'Azira' }}
      DEFAULT_REGION: ${{ vars.DEFAULT_REGION || 'au' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check variables and secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
          STRIPE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_KEY }}
        run: |
          fail=0
          for pair in "BACKEND_URL:$BACKEND_URL" "BASE_URL:$BASE_URL"; do
            case "${pair#*:}" in
              https://*) ;;
              *) echo "::error::${pair%%:*} must start with https://"; fail=1 ;;
            esac
          done
          [ -n "$IMAGE_HOST" ] || { echo "::error::IMAGE_HOST is empty (the image host without a scheme, img.azira.com.au)."; fail=1; }
          [ -n "$CF_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is not set."; fail=1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is not set."; fail=1; }
          [ -n "$PUBLISHABLE_KEY" ] || { echo "::error::Secret NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY is not set (the publishable API key from the admin: Settings > Publishable API Keys)."; fail=1; }
          [ -n "$STRIPE_KEY" ] || { echo "::error::Secret NEXT_PUBLIC_STRIPE_KEY is not set (the Stripe publishable key, pk_live_...)."; fail=1; }
          case "$STRIPE_KEY" in
            *placeholder*) echo "::error::NEXT_PUBLIC_STRIPE_KEY is still a placeholder."; fail=1 ;;
          esac
          if grep -q "REPLACE_AFTER_wrangler_d1_create" apps/storefront/wrangler.jsonc; then
            echo "::error::apps/storefront/wrangler.jsonc still has the D1 database_id placeholder. Run 'wrangler d1 create azira-tag-cache' and commit the id."
            fail=1
          fi
          exit "$fail"

      # Reads the pnpm version from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # OpenNext runs the storefront's own "build" script (next build). The build
      # does not fetch from the backend, but NEXT_PUBLIC_* values are baked in.
      - name: Build
        working-directory: apps/storefront
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ env.BACKEND_URL }}
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ env.BASE_URL }}
          NEXT_PUBLIC_IMAGE_HOST: ${{ env.IMAGE_HOST }}
          NEXT_PUBLIC_STORE_NAME: ${{ env.STORE_NAME }}
          NEXT_PUBLIC_DEFAULT_REGION: ${{ env.DEFAULT_REGION }}
        run: pnpm exec opennextjs-cloudflare build

      # Fills the R2 and D1 caches, then runs wrangler deploy.
      - name: Deploy
        working-directory: apps/storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy
