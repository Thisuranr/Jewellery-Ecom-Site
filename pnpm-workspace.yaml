packages:
  - "apps/**"
  - "!apps/backend/.medusa/**"

# pnpm 11+
allowBuilds:
  "@medusajs/telemetry": true

# pnpm 10.x
onlyBuiltDependencies:
  - "@medusajs/telemetry"

# Needed for `pnpm deploy` (the backend Docker image) in pnpm 10: deploy then
# uses the shared lockfile. No package here depends on another workspace
# package, so this changes nothing else.
injectWorkspacePackages: true
